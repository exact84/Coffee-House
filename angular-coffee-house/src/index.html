<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coffee House</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Experience the perfect cup at Coffee House. Discover our premium coffee selection, fresh pastries, and cozy atmosphere."
    />
    <meta name="keywords" content="coffee, cafe, coffee house, espresso, latte, pastries" />
    <link rel="icon" href="assets/img/logo.png" />
    <script>
      if (window.location.pathname !== '/Coffee-House/' && !window.location.hash) {
        const route = window.location.pathname.replace('/Coffee-House', '');
        window.location.hash = route || '/';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
