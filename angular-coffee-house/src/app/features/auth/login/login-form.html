<form class="login-container" autocomplete="off" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h2 class="typography-heading-2">Sign In</h2>

  <div class="input-container-login typography-body-medium">
    <label class="label-input" for="username">
      Login:
      <input
        id="username"
        formControlName="username"
        class="input-field"
        placeholder="Placeholder"
        [ngClass]="{
          valid: isValid('username'),
          invalid: isInvalid('username'),
        }"
        (focus)="clearError('username')"
        (blur)="markTouched('username')"
      />
      @if (fieldErrors['username']) {
        <div class="error-msg">
          {{ fieldErrors['username'] }}
        </div>
      }
    </label>

    <label class="label-input" for="password">
      Password:
      <input
        id="password"
        type="password"
        formControlName="password"
        class="input-field"
        placeholder="Placeholder"
        [ngClass]="{
          valid: isValid('password'),
          invalid: isInvalid('password'),
        }"
        (focus)="clearError('password')"
        (blur)="markTouched('password')"
      />
      @if (fieldErrors['password']) {
        <div class="error-msg">
          {{ fieldErrors['password'] }}
        </div>
      }
    </label>
  </div>

  <div class="button-container">
    <button
      type="submit"
      class="register-btn typography-action-link-button"
      [disabled]="loginForm.invalid"
    >
      Sign In
    </button>
    @if (errorMessage()) {
      <div class="error-msg visible">
        {{ errorMessage() }}
      </div>
    }
  </div>
</form>
