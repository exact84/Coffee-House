<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>
    <link rel="stylesheet" href="./styles/menu.css" type="text/css" />
    <link rel="icon" href="./assets/img/logo.png" />
  </head>
  <body>
    <header class="header" id="header"></header>
    <main>
      <section class="top">
        <div class="offer">
          <h2 class="typography-heading-2">
            Behind each of our cups hides an
            <span class="typography-accent">amazing surprise</span>
          </h2>
          <div class="tabs">
            <div class="tab-item tab-item-active" data-tab="coffee">
              <span class="tab-icon tab-icon-active">
                <img src="./assets/img/tabs/coffee.png" alt="coffee" />
              </span>
              <span class="typography-action-link-button tab-text">Coffee</span>
            </div>
            <div class="tab-item" data-tab="tea">
              <span class="tab-icon">
                <img src="./assets/img/tabs/tea.png" alt="tea" />
              </span>
              <span class="typography-action-link-button tab-text">Tea</span>
            </div>
            <div class="tab-item" data-tab="dessert">
              <span class="tab-icon">
                <img src="./assets/img/tabs/dessert.png" alt="dessert" />
              </span>
              <span class="typography-action-link-button tab-text">Dessert</span>
            </div>
          </div>
        </div>
        <div id="grid" class="menu-grid">
          <span class="typography-heading-3 loading" class="loading" id="loader">Loading...</span>
        </div>
      </section>
    </main>
    <footer class="contact" id="contact"></footer>
    <script type="module" src="./src/menu.ts"></script>
  </body>
</html>
